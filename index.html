<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Final Cut</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Final Cut">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08090c">
<meta name="robots" content="noindex">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#08090c;color:#f3efe6;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  body{display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));
    background:radial-gradient(70% 55% at 50% 40%,#2a1f0a 0%,#08090c 70%)}
  main{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
  .icon{width:132px;height:132px;border-radius:30px;box-shadow:0 30px 80px -20px rgba(240,180,67,.55),0 0 0 1px rgba(255,255,255,.08)}
  h1{margin:6px 0 0;font-weight:900;font-size:40px;letter-spacing:.02em;line-height:1}
  h1 b{color:#f0b443}
  .status{font:12px ui-monospace,Menlo,monospace;letter-spacing:.28em;text-transform:uppercase;color:rgba(243,239,230,.55)}
  .bar{width:160px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar i{display:block;height:100%;width:40%;background:#f0b443;animation:load 1.1s ease-in-out infinite}
  @keyframes load{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:999px;background:#f0b443;color:#1a1306;font-weight:700;text-decoration:none}
  .how{display:none;margin-top:6px;padding:16px 18px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);text-align:left;font-size:15px;color:rgba(243,239,230,.85)}
  .how ol{margin:8px 0 0;padding-left:20px}
  .browser .how{display:block}
  .browser .bar,.browser .status{display:none}
  @media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>
</head>
<body>
<main>
  <img class="icon" src="icon-512.png" alt="">
  <h1>FINAL<b>/</b>CUT</h1>
  <div class="status" id="status">Opening</div>
  <div class="bar" aria-hidden="true"><i></i></div>
  <a class="btn" id="open" href="https://claude.ai/artifact/FBSoibXkU4ng5Siuw5xL4y">Open Final Cut</a>
  <div class="how">
    <b>Put Final Cut on your Home Screen</b>
    <ol>
      <li>Tap the Share button in Safari.</li>
      <li>Tap <b>Add to Home Screen</b>.</li>
      <li>Keep <b>Open as Web App</b> on, then tap <b>Add</b>.</li>
    </ol>
  </div>
</main>
<script>
  // Launched from the Home Screen icon: go straight to Final Cut.
  // Opened in a normal browser tab: show how to add the icon instead.
  var APP = "https://claude.ai/artifact/FBSoibXkU4ng5Siuw5xL4y";
  var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  function go() { location.replace(APP); }
  if (standalone) {
    setTimeout(go, 300);
    // Coming back to the launcher (for example after swiping back) opens Final Cut again.
    addEventListener("pageshow", function (e) { if (e.persisted) setTimeout(go, 300); });
  } else {
    document.body.classList.add("browser");
  }
</script>
</body>
</html>
